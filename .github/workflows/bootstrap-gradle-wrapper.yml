name: Bootstrap Gradle wrapper once

on:
  push:
    branches:
      - cursor/pocket-spike-51b9

permissions:
  contents: write

jobs:
  wrapper:
    if: ${{ !contains(github.event.head_commit.message, 'Commit verified Gradle wrapper') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cursor/pocket-spike-51b9
          fetch-depth: 0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          gradle-version: "8.9"
      - name: Generate and verify wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon wrapper --gradle-version 8.9 --distribution-type bin
          chmod 0755 gradlew
          actual_jar="$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)"
          echo "wrapper jar sha256: $actual_jar"
          test "$actual_jar" = "498495120a03b9a6ab5d155f5de3c8f0d986a449153702fb80fc80e134484f17"
          grep -Fxq 'distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip' gradle/wrapper/gradle-wrapper.properties
          if ! grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties; then
            printf '\ndistributionSha256Sum=%s\n' 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab' >> gradle/wrapper/gradle-wrapper.properties
          fi
          ./gradlew --version
      - name: Commit wrapper and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-gradle-wrapper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper .github/workflows/bootstrap-gradle-wrapper.yml
          git commit -m "Commit verified Gradle wrapper"
          git push origin HEAD:cursor/pocket-spike-51b9
