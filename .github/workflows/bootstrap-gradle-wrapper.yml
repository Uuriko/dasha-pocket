name: Bootstrap Gradle wrapper once

on:
  push:
    branches:
      - cursor/pocket-spike-51b9

permissions:
  contents: write

jobs:
  wrapper:
    if: ${{ !contains(github.event.head_commit.message, 'Commit verified Gradle wrapper') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: cursor/pocket-spike-51b9
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          gradle-version: "8.9"
      - name: Generate and verify wrapper
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon wrapper --gradle-version 8.9 --distribution-type bin
          chmod 0755 gradlew
          test "$(sha256sum gradle/wrapper/gradle-wrapper.jar | cut -d' ' -f1)" = "4984950aa511b11f06a7e1a48e1fef9b19473d528f2eb47bceac1ffa6b68f36d"
          grep -q '^distributionUrl=https\\://services.gradle.org/distributions/gradle-8.9-bin.zip$' gradle/wrapper/gradle-wrapper.properties
          if ! grep -q '^distributionSha256Sum=' gradle/wrapper/gradle-wrapper.properties; then
            printf '\ndistributionSha256Sum=%s\n' 'd725d707bfabd4dfdc958c624003b3c80accc03f7037b5122c4b1d0ef15cecab' >> gradle/wrapper/gradle-wrapper.properties
          fi
          ./gradlew --version
      - name: Commit wrapper and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bootstrap-gradle-wrapper.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper .github/workflows/bootstrap-gradle-wrapper.yml
          git commit -m "Commit verified Gradle wrapper"
          git push origin HEAD:cursor/pocket-spike-51b9
