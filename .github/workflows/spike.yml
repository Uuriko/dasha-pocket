name: Spike
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  commons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: bash scripts/vendor-commons.sh
      - run: node test/spike.test.mjs
# No Android / Gradle job. dasha-desk Verify does not build APKs.
